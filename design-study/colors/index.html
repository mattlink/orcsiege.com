<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <title>Orc Siege / Color study 02</title>
  <link rel="icon" href="data:,">
  <link rel="stylesheet" href="../../assets/fonts.css">
  <link rel="stylesheet" href="./workbench.css">
  <script type="module" src="./workbench.js"></script>

<body>
  <main>
    <header>
      <p class="label">ORC SIEGE / STUDY 02</p>
      <h1>Orange on black.</h1>
      <p>One layout, eight palettes. Hover near the title to loosen the letters, then brush, grab, or flick them. On touch, tap to wake them first.</p>
    </header>
    <section id="preview" aria-labelledby="preview-title">
      <div class="tools">
        <h2 id="preview-title">Live preview</h2>
        <label for="texture">Motion texture</label>
        <select id="texture">
          <option value="single">Jacquard only</option>
          <option value="dual">Jacquard → Bastarda</option>
        </select>
        <a id="open" href="./study.html?v=01">Full screen ↗</a>
      </div>
      <nav id="options" aria-label="Choose a palette"></nav>
      <iframe id="screen" title="Orc Siege homepage preview" hidden></iframe>
      <p id="caption" aria-live="polite"></p>
      <noscript><p>See the <a href="./study.html">static title</a>. Live switching and motion need JavaScript.</p></noscript>
    </section>
    <section class="palettes" aria-labelledby="palette-title">
      <h2 id="palette-title">Palettes</h2>
      <div id="cards" class="cards"></div>
    </section>
    <footer>
      <a href="../">Study 03: layouts</a>
      <a href="../framed/">Study 01: framed archive</a>
      <a href="../../">Website homepage</a>
    </footer>
  </main>
