<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <meta name="theme-color" content="#090909">
  <title>Orc Siege</title>
  <link rel="icon" href="data:,">
  <link rel="stylesheet" href="../../assets/fonts.css">
  <link rel="stylesheet" href="../../assets/title.css">
  <script type="module" src="../study.js"></script>
</head>
<body>
  <main class="scene" data-variant="01">
    <div class="frame" role="group" aria-labelledby="game-title" aria-describedby="motion-help" tabindex="0">
      <div class="playfield">
        <h1 class="title" id="game-title"><span>Orc</span> <span>Siege</span></h1>
        <div class="letter-layer" hidden></div>
      </div>
    </div>
    <p class="sr-only" id="motion-help">Move near the title to wake the letters, then brush or drag them. Tap the title area or press Space or Enter to keep them loose. Tab to a loose letter and use the arrow keys to nudge it. Escape recalls the title.</p>
    <div class="scene-tools" hidden>
      <button type="button" id="wake" aria-pressed="false">Wake letters</button>
      <button type="button" id="pause" aria-pressed="false">Pause motion</button>
      <a id="all-studies" href="./">All palettes</a>
    </div>
  </main>
</body>
</html>
