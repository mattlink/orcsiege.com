<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#242424">
  <meta name="description" content="Orc Siege is a turn-based tower defense game built with ASCII graphics. Play Orc Siege Classic or learn about the project.">
  <title>Orc Siege</title>
  <link rel="icon" href="./favicon.svg?v=os" type="image/svg+xml">
  <link rel="stylesheet" href="./assets/fonts.css">
  <link rel="stylesheet" href="./assets/title.css">
  <link rel="stylesheet" href="./assets/landing.css?v=center-stack">
  <script type="module" src="./assets/title-motion.js"></script>
</head>
<body>
  <main class="scene landing" data-site data-layout="08">
    <div class="site-grid">
      <div class="frame" role="group" aria-labelledby="game-title" aria-describedby="motion-help" tabindex="0">
        <h1 class="title" id="game-title"><span>Orc</span> <span>Siege</span></h1>
        <div class="playfield"><div class="letter-layer" hidden></div></div>
      </div>
      <nav class="site-nav" aria-label="Orc Siege">
        <a href="https://classic.orcsiege.com/">Orc Siege Classic</a>
        <a href="./about/">About</a>
      </nav>
    </div>
    <p class="sr-only" id="motion-help">Move or tap near the title to wake the letters. To play by keyboard, press Space or Enter here, then Tab to a loose letter and use the arrow keys. Escape recalls the title. Press P while the title area is focused to pause or resume motion.</p>
  </main>
</body>
</html>
